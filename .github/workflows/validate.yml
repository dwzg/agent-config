name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Checks marketplace.json, every plugin.json, and the frontmatter of
      # every skill and agent. Needs no login.
      - name: Validate the marketplace and its plugins
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .
          for p in plugins/*/; do
            npx -y @anthropic-ai/claude-code@2.1.296 plugin validate "$p"
          done
