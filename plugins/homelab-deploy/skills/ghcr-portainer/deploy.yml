name: Build and Deploy to GHCR

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN does not start other workflows; anything
  # that commits to main on its own must call this explicitly.
  workflow_dispatch:

# Two deploys racing would leave whichever image finished last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default "docker" driver cannot export a build cache.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the push, never after: run last, it races the webhook for the
      # image that was just pushed.
      - name: Delete old untagged package versions
        continue-on-error: true
        uses: minish144/delete-untagged-action@v2
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          personal-account: true

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # The SHA tag is what a rollback pins.
          tags: |
            ghcr.io/${{ github.repository_owner }}/IMAGE_NAME:latest
            ghcr.io/${{ github.repository_owner }}/IMAGE_NAME:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain manifest, not an index: an attestation's untagged children
          # are deleted by the cleanup above, and every pull then fails with
          # "manifest unknown".
          provenance: false
          sbom: false

      - name: Trigger Portainer webhook
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK_URL }}
